name: Deploy to Server

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./workspace

    steps:
      - name: Checkout the code into workspace
        uses: actions/checkout@v3
        with:
          path: ./workspace

      - name: Set up SSH for Git Operations
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install dependencies and build Docker containers
        run: |
          # Run the install script to build and prepare containers locally
          chmod +x ./bin/install.sh 
          ./bin/install.sh

      - name: Rsync Deploy
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude-from='./workspace/rsync.excludes'
          path: ./workspace/
          remote_path: /home/linuxuser/web_server/loopai_app/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: linuxuser
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run server-side deployment script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the deployment directory
            cd /home/linuxuser/web_server/loopai_app
            ls -la
            # Set executable permissions on the server deployment script
            chmod +x ./bin/server_deploy.sh
            
            # Run the server-side deployment script
            ./bin/server_deploy.sh
