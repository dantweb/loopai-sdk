name: CI/CD Pipeline

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/loopai_web:latest ./path/to/backend
          docker push ghcr.io/${{ github.repository_owner }}/loopai_web:latest

      - name: Build and Push Frontend Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/vue_admin:latest ./view/vue/admin
          docker push ghcr.io/${{ github.repository_owner }}/vue_admin:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run server-side deployment script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the deployment directory
            cd /home/${{ secrets.SERVER_USERNAME }}/web_server/loopai_app
            ls -la
            docker-compose pull
            docker-compose up -d
     
