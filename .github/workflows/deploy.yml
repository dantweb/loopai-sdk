name: Deploy to Server

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Set up SSH for Git Operations
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install dependencies and build Docker containers
        run: |
          # Run the install script to build and prepare containers locally
          chmod +x ./bin/install.sh
          ./bin/install.sh

      - name: Sync updated files to the server
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Ensure correct paths and exclude unnecessary directories during sync
            rsync -avz --delete \
              --exclude 'var/filesystem' \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'web/users' \
              --exclude 'users' \
              --exclude 'node_modules' \
              ./ /home/linuxuser/web/loopai/

      - name: Run server-side deployment script
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to the deployment directory
            cd /home/linuxuser/web/loopai
            
            # Set executable permissions on the server deployment script
            chmod +x ./bin/server_deploy.sh
            
            # Run the server-side deployment script
            ./bin/server_deploy.sh
