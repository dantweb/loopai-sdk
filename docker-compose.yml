services:
  db:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: loopai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8088:8080"

  web:
    build:
      context: ./
      dockerfile: ./Dockerfile
    container_name: loopai_web
    ports:
      - "5000:5000"
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - FLASK_APP=web/web_interface.py  # Set to your Flask app entry point
      - FLASK_ENV=development
      - SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI}
    logging:
      driver: "syslog"  # Using syslog driver
      options:
        syslog-address: "udp://localhost:514"  # Address of the syslog server
        tag: "loopai_web"  # Optional tag for log identification


  frontend:
    build:
      context: ./view/vue/admin
      dockerfile: Dockerfile.frontend
    container_name: vue_admin
    ports:
      - "8080:80"

volumes:
  postgres_data:
    driver: local
