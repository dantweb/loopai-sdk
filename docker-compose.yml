services:
  db:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRESQL_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DB_NAME}
      POSTGRESQL_DB_HOST: ${POSTGRESQL_DB_HOST}
      POSTGRESQL_DB_PORT: ${POSTGRESQL_DB_PORT}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - debug_network
      - shared_network
#
#  adminer:
#    image: adminer
#    container_name: adminer
#    restart: always
#    ports:
#      - "8088:8080"
#    networks:
#      - debug_network

  loopai_web:
    build:
      context: ./loopai_src
      dockerfile: Dockerfile
    container_name: loopai_web
    ports:
      - "5050:5000"
      - "5678:5678"
    working_dir: /app
    volumes:
      - ./loopai_src:/app
      - ./bin:/app/bin
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    group_add:
      - ${DOCKER_SOCKET_GID:-991}
    depends_on:
      - db
      - redis
    environment:
      - PYTHONPATH=/app
      - FLASK_APP=app.web
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - POSTGRESQL_DB_HOST=host.docker.internal
      - POSTGRESQL_DB_PORT=${POSTGRESQL_DB_PORT}
      - POSTGRESQL_DB_NAME=${POSTGRESQL_DB_NAME}
      - POSTGRESQL_DB_PASSWORD=${POSTGRESQL_DB_PASSWORD}
      - SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRESQL_DB_USER}:${POSTGRESQL_DB_PASSWORD}@${POSTGRESQL_DB_HOST}:${POSTGRESQL_DB_PORT}/${POSTGRESQL_DB_NAME}
      - WEB_IN_DOCKER=true
      - VUE_APP_API_BASE_HOST=${VUE_APP_API_BASE_HOST}
      - VUE_APP_API_BASE_URL=${VUE_APP_API_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: [ "gunicorn", "-c", "/app/web/gunicorn.conf.py", "--worker-class", "gevent", "web.__main__:app" ]

    networks:
      - debug_network
      - shared_network

  frontend:
    build:
      context: ./loopai_src/view/vue/admin
      dockerfile: Dockerfile.frontend
      args:
        - VUE_APP_API_BASE_URL=${VUE_APP_API_BASE_URL}
        - VUE_APP_API_BASE_HOST=${VUE_APP_API_BASE_HOST}
    container_name: vue_admin
    ports:
      - "8080:80"
    environment:
      - VUE_APP_API_BASE_URL
      - VUE_APP_API_BASE_HOST
    networks:
      - debug_network

  redis:
      image: redis:latest
      container_name: redis
      ports:
        - "6379:6379"
      networks:
        - debug_network

